[project]
name = "ha-tado-overlay-metadata"
version = "0.1.0"
description = "Read original Tado heating overlay settings and expiry times in Home Assistant"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "voluptuous==0.16.0", "ruff==0.16.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
