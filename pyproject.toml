[project]
name = "ha-tado-overlay-metadata"
version = "0.1.3"
description = "Read original Tado heating overlay settings and expiry times in Home Assistant"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = ["pytest==9.0.3", "voluptuous==0.16.0", "ruff==0.17.2"]

# The HA test plugin pins pytest 9.0.3; keep the portable suite on the same version.
ha-test = [
    "homeassistant==2026.10.4; sys_platform == 'linux'",
    "pytest-homeassistant-custom-component==0.13.375; sys_platform == 'linux'",
    # Match Home Assistant's built-in Tado manifest, rather than PyPI's latest major.
    "python-tado==0.18.16; sys_platform == 'linux'",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
