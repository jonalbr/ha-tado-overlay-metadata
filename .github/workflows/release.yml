name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --locked
      - name: Prepare release assets and notes
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          uv run python scripts/prepare_release.py --tag "$RELEASE_TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ASSET: ${{ steps.package.outputs.asset_path }}
          RELEASE_NOTES: ${{ steps.package.outputs.notes_path }}
        run: >-
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET"
          --verify-tag --title "$RELEASE_TAG" --notes-file "$RELEASE_NOTES"
