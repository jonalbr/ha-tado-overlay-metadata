name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --ignore=tests/ha
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check_release.py
  home-assistant:
    name: Home Assistant config flow and lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --locked --group ha-test
      - run: >-
          uv run --group ha-test pytest tests/ha -o asyncio_mode=auto
          -o asyncio_default_fixture_loop_scope=function
          --cov=custom_components/tado_overlay_metadata
          --cov-branch --cov-report=term-missing --cov-fail-under=100
  hacs:
    name: HACS compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Marketplace uses this catalog validator too.
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master
